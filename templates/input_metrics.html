<form method="POST" action="{{ url_for('main.input_metrics') }}">

    <div class="card shadow-sm border-0 mb-3">
        <div class="card-body">

            <div class="fw-bold mb-3">Daily Input (Yesterday)</div>
            <div class="alert alert-info">
                Enter yesterday’s Gross Performance. This drives all forecasting and pacing. Appt data is today's appts.
            </div>

            <!-- GROSS INPUTS -->
            <div class="row">

                <div class="col-md-4 mb-3">
                    <label class="form-label">Labor Gross</label>
                    <input type="number" step="0.01" name="labor_gross" class="form-control" required autofocus>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Parts Gross</label>
                    <input type="number" step="0.01" name="parts_gross" class="form-control">
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Sublet / Other</label>
                    <input type="number" step="0.01" name="sublet_gross" class="form-control">
                </div>

            </div>

            <!-- APPOINTMENTS -->
            <div class="row">

                <div class="col-md-4 mb-3">
                    <label class="form-label">Today Appointments</label>
                    <input type="number" name="today_appts" class="form-control">
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Next 7 Day Appointments</label>
                    <input type="number" name="appt_7_day" class="form-control">
                </div>

            </div>

            <!-- SUBMIT -->
            <button type="submit" class="btn btn-primary w-100">
                Save Metrics
            </button>

        </div>
    </div>

</form>
