{% extends "base.html" %}

{% block content %}

<div class="container py-4">

    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow-sm">

                <div class="card-header fw-bold">
                    Daily Metrics Input
                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">
                            <label class="form-label">MTD Gross</label>
                            <input type="number" step="0.01" name="mtd_gross" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Yesterday Gross</label>
                            <input type="number" step="0.01" name="yesterday_gross" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Today's Appointments</label>
                            <input type="number" name="today_appts" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Next 7 Days Appointments</label>
                            <input type="number" name="appt_7_day" class="form-control">
                        </div>

                        <button class="btn btn-primary w-100">
                            Save Metrics
                        </button>

                    </form>

                </div>

            </div>

        </div>
    </div>

</div>

{% endblock %}
