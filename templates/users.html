{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Manage Users</h2>
    <a href="{{ url_for('admin.add_user') }}" class="btn btn-primary">
        + Add New User
    </a>
</div>

<div class="card shadow-sm">
    <div class="card-body p-0">
        <table class="table table-striped table-hover mb-0 align-middle">
            <thead class="table-light">
                <tr>
                    <th class="py-3 px-3">Email</th>
                    <th class="py-3 px-3">Access Level</th>
                    <th class="py-3 px-3">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                <tr>
                    <td class="py-3 px-3">{{ user.email }}</td>
                    <td class="py-3 px-3">{{ user.access_level.title() }}</td>
                    <td class="py-3 px-3">
                        <a href="{{ url_for('admin.edit_user', user_id=user.id) }}" class="btn btn-sm btn-outline-secondary">Edit</a>
                        <a href="{{ url_for('admin.admin_reset_password', user_id=user.id) }}" class="btn btn-sm btn-outline-warning ms-1">Reset Password</a>
                        {% if current_user.id != user.id %}
                        {% endif %}
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="3" class="text-center text-muted p-4">No users found.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
